services:
  postgres:
    image: postgres:16
    container_name: apptracker-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: YOUR_PASSWORD_HERE
      POSTGRES_DB: apptracker
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./pg_hba.conf:/var/lib/postgresql/data/pg_hba.conf

  adminer:
    image: adminer
    container_name: apptracker-adminer
    ports:
      - "8080:8080"
    depends_on:
      - postgres

volumes: pgdata:data
