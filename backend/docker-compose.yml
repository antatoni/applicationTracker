services:
  postgres:
    image: postgres:16
    container_name: apptracker-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: apptracker
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  adminer:
    image: adminer
    container_name: apptracker-adminer
    ports:
      - "8080:8080"
    depends_on:
      - postgres

volumes:
  pgdata: